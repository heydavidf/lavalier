# Checks for Lavalier, a Swift menu-bar app for macOS.
# Runs on every push to main, on pull requests, weekly and on demand.
# Two jobs, two check names for the require-ci ruleset: "checks" (build and tests on macOS) and
# "hygiene" (docs, tripwire and secret scan on Linux). Keep both names stable.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Newest stable Xcode on the runner (the project is tested with Xcode 27)
        run: |
          newest=$(find /Applications -maxdepth 1 -name 'Xcode_[0-9]*.app' | grep -v -i -e beta -e rc | sort -V | tail -n 1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build (debug, every product)
        run: swift build

      - name: Unit tests (no network, no keys)
        run: swift test

      - name: App bundle (release build, signed ad hoc)
        env:
          LAVALIER_SIGN_IDENTITY: "-"
        run: ./build.sh

      - name: Built app starts and draws its menu-bar icons
        run: |
          build/Lavalier.app/Contents/MacOS/Lavalier --render-glyphs "$RUNNER_TEMP/glyphs"
          count=$(find "$RUNNER_TEMP/glyphs" -name '*.png' | wc -l | tr -d ' ')
          echo "$count PNG files"
          test "$count" -gt 0

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists a pull request's commits through the API
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Shell blocks in the docs paste cleanly (bash and zsh)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh
          bash .github/check-shell-blocks.sh

      - name: Shell-block checker's own tests
        run: python -m unittest discover -s .github/tests -v

      - name: Tripwire (personal paths, junk files, silenced checks)
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && git cat-file -e "$BASE_REF" 2>/dev/null; then bash .github/tripwire.sh "$BASE_REF"; else echo "::warning::No base commit available, so newly silenced checks were not looked for"; bash .github/tripwire.sh; fi

      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The token is read-only, so report findings in the job log instead of as pull request comments.
          GITLEAKS_ENABLE_COMMENTS: "false"
